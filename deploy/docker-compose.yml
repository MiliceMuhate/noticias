# Corre diretamente na VPS, dentro do clone do repositório (deploy/deploy.sh
# chama `docker compose build` aqui) — sem registry, sem GitHub Actions.
services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file:
      - ./api.env
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    restart: unless-stopped
    environment:
      # domínio canónico do site público (canonical, og:url, JSON-LD, sitemap.xml)
      SITE_URL: ${SITE_URL:-https://footballtrend.online}
    ports:
      - "127.0.0.1:8080:3000"
