# Corre diretamente na VPS, dentro do clone do repositório (deploy/deploy.sh
# chama `docker compose build` aqui) — sem registry, sem GitHub Actions.
services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file:
      - ./api.env
    environment:
      # agente de descoberta de notícias (ver hermes/runner.py e
      # apps/api/app/services/hermes.py) — só pela rede interna do compose.
      # Sem HERMES_RUNNER_TOKEN em deploy/.env o deploy segue na mesma: só o
      # Hermes fica inativo (recusa pedidos), o resto do site atualiza.
      HERMES_RUNNER_URL: http://hermes:8700
      HERMES_RUNNER_TOKEN: ${HERMES_RUNNER_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"

  # Hermes Agent (Nous Research): procura notícias e cruza-as com outras
  # fontes. Sem chave da base de dados, sem porta publicada, só ferramentas
  # de pesquisa web — a chave da IA chega a cada execução, vinda do Vault.
  hermes:
    build:
      context: ./hermes
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${HERMES_RUNNER_TOKEN:-}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        # ID público do editor AdSense (o mesmo que está em apps/web/public/ads.txt)
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID:-ca-pub-3729442721390367}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    restart: unless-stopped
    environment:
      # domínio canónico do site público (canonical, og:url, JSON-LD, sitemap.xml)
      SITE_URL: ${SITE_URL:-https://footballtrend.online}
      # o painel chega à API por /api (proxy em apps/web/server.js), pela rede
      # interna do compose — a API continua sem porta pública
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:8080:3000"
