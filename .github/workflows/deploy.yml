name: Deploy produção

# Fluxo: testa web+api -> aplica migrações Supabase -> build+push das imagens
# Docker para o GHCR -> liga-se via SSH à VPS Contabo e faz `docker compose pull/up`.
# Guardrails (CLAUDE.md): nenhum segredo neste ficheiro, tudo vem de Secrets/Variables
# do repositório GitHub (Settings -> Secrets and variables -> Actions).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.lc.outputs.owner }}
    steps:
      - id: lc
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .[test]
      - run: pytest
        env:
          # valores fictícios só para satisfazer `Settings()` no import (config.py) —
          # nenhum destes testes fala com Supabase/Anthropic reais.
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_SERVICE_ROLE_KEY: "test"
          ANTHROPIC_API_KEY: "test"

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck

  migrate-db:
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrações no projeto Supabase de produção
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  build-push-api:
    needs: [vars, test-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ needs.vars.outputs.owner }}/noticias-api:latest
            ghcr.io/${{ needs.vars.outputs.owner }}/noticias-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-web:
    needs: [vars, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # variáveis VITE_* ficam embebidas no bundle estático em build-time — só
          # valores públicos (chave anon, client id AdSense), nunca segredos reais.
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_ADSENSE_CLIENT_ID=${{ vars.VITE_ADSENSE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ needs.vars.outputs.owner }}/noticias-web:latest
            ghcr.io/${{ needs.vars.outputs.owner }}/noticias-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [vars, build-push-api, build-push-web, migrate-db]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar docker-compose.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/docker-compose.yml"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      - name: Pull + restart dos containers na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            export GHCR_OWNER="${{ needs.vars.outputs.owner }}"
            export IMAGE_TAG="${{ github.sha }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
